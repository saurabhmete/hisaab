<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Hisaab{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128181;</text></svg>">
</head>
<body>
<script>
/* Apply privacy mode before first paint to avoid flashing the numbers. */
try { if (localStorage.getItem('hisaab_privacy') === '1') document.body.classList.add('privacy'); } catch (e) {}
</script>
<nav class="topnav">
  <a class="brand" href="/">&#128181; Hisaab</a>
  <div class="links">
    <a href="/" {% if request.url.path == '/' %}class="active"{% endif %}>Dashboard</a>
    <a href="/years" {% if request.url.path == '/years' or request.url.path.startswith('/year/') %}class="active"{% endif %}>Years</a>
    <a href="/investments" {% if request.url.path == '/investments' %}class="active"{% endif %}>Investments</a>
    <a href="/import" {% if request.url.path == '/import' %}class="active"{% endif %}>Import</a>
    {% if user and user.is_admin %}
    <a href="/users" {% if request.url.path == '/users' %}class="active"{% endif %}>Users</a>
    {% endif %}
  </div>
  <div class="usermenu">
    <button type="button" id="privacybtn" title="Hide amounts (demo mode)" aria-pressed="false">
      <svg id="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      <svg id="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
    </button>
    {% if user %}
    <span>{{ user.username }}</span>
    <form method="post" action="/logout"><button type="submit">Log out</button></form>
    {% endif %}
  </div>
</nav>
<main>
{% block content %}{% endblock %}
</main>
<script>
(function () {
  const btn = document.getElementById('privacybtn');
  const open = document.getElementById('eye-open'), closed = document.getElementById('eye-closed');
  function render(on) {
    document.body.classList.toggle('privacy', on);
    open.style.display = on ? 'none' : '';
    closed.style.display = on ? '' : 'none';
    btn.setAttribute('aria-pressed', on);
    btn.title = on ? 'Show amounts' : 'Hide amounts (demo mode)';
  }
  let on = false;
  try { on = localStorage.getItem('hisaab_privacy') === '1'; } catch (e) {}
  render(on);
  btn.addEventListener('click', () => {
    on = !on;
    try { localStorage.setItem('hisaab_privacy', on ? '1' : '0'); } catch (e) {}
    render(on);
  });
})();
</script>
</body>
</html>
